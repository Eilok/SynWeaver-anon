[project]
name = "synweaver"
version = "0.1.0"
description = "Web agent training data synthesis pipeline"
requires-python = ">=3.11"
dependencies = [
    "aiolimiter>=1.2.1",
    "beartype>=0.22.9",
    "evaluate>=0.4.6",
    "flask>=3.1.2",
    "gymnasium>=1.3.0",
    "json-repair>=0.55.0",
    "jsonlines>=4.0.0",
    "langchain>=1.2.6",
    "langchain-openai>=1.1.7",
    "lxml>=6.0.2",
    "neo4j>=6.1.0",
    "nltk>=3.9.2",
    "numpy>=2.4.1",
    "openai>=2.53.0",
    "pillow>=12.1.0",
    "playwright>=1.57.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "text-generation>=0.7.0",
    "tiktoken>=0.12.0",
]

[tool.pyright]
root = "."
extraPaths = ["."]
